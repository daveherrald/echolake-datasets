name: Validate datasets

on:
  pull_request:
    paths:
      - "datasets/**"
      - "scripts/validate_datasets.py"
      - "scripts/generate_splunk_metadata.py"
      - "scripts/acquire_bots_checksums.py"
      - "scripts/data/**"
      - ".github/workflows/validate-datasets.yml"
  push:
    branches:
      - main
    paths:
      - "datasets/**"
      - "scripts/validate_datasets.py"
      - "scripts/generate_splunk_metadata.py"
      - "scripts/acquire_bots_checksums.py"
      - "scripts/data/**"
      - ".github/workflows/validate-datasets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out datasets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check out EchoLake runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: daveherrald/echolake
          ref: dd44b21f40db4d7d31d28bdccf2b3f77ee7bedd6
          path: .ci/echolake
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install EchoLake
        run: python -m pip install ./.ci/echolake

      - name: Validate BOTS checksum audit trail
        run: python scripts/acquire_bots_checksums.py --validate-only

      - name: Check generated Splunk and BOTS metadata
        run: python scripts/generate_splunk_metadata.py --check

      - name: Validate all datasets offline
        run: python scripts/validate_datasets.py
