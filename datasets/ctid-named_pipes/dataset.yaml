    description: Named-pipe IPC micro-emulation
  name: ctid-named_pipes
  version: 1.0.0
  description: 'CTID micro emulation plan ''Named Pipes'' executed on a clean, instrumented Windows 11
    workstation (EMU-WS01) and captured as replayable synthetic security telemetry. The CTID named_pipes
    emulator (executor/server/client) creates a Cobalt-Strike-pattern named pipe (\\.\pipe\MSSE-a09-server),
    the client connects, data is exchanged, then it closes. Distinctive pipe name mimics CS Artifact Kit.
    Tool launched via a transient Task Scheduler action so process ancestry is svchost.exe (no orchestration
    scaffolding in the capture). Source: github.com/center-for-threat-informed-defense/adversary_emulation_library.'
  author: EchoLake Project
  created: '2026-06-28'
  license: CC0-1.0
  tags:
  - ctid
  - micro-emulation
  - named_pipes
  - T1559
  - execution
  - windows
  - sysmon
  - echolake
  mitre_attack:
    techniques:
    - id: T1559
      name: Inter-Process Communication
      tactics:
      - execution
    tactics:
    - execution
  timestamp_range:
    earliest: '2026-06-28T16:40:13Z'
    latest: '2026-06-28T16:41:13Z'
    field: _event_time
