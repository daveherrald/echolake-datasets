    hostname: EMU-WS01
    os: Windows 11 Enterprise Eval
    workgroup: WORKGROUP
    platform: Proxmox/QEMU
    network: VLAN4 (zeek-monitored)
  execution:
    binary: namedpipes_executor.exe
    args:
    - --pipe
    - '1'
    - --server
    - C:\Windows\Temp\tools\named_pipes\build\namedpipes_server.exe
    - --client
    - C:\Windows\Temp\tools\named_pipes\build\namedpipes_client.exe
    launch: transient scheduled task (SYSTEM, parent=svchost.exe)
