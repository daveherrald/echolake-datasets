title: GitHub Secret-Scanning Alert Resolved as wont_fix
id: 89f26b8f-04a9-5a0e-b6a3-8b5ce10400ef
status: experimental
description: |
  Detects a GitHub secret-scanning alert closed with resolution wont_fix.
  Resolving a leaked-credential alert without rotating the secret leaves the
  exposed credential valid; in this dataset the SSH-key alert is closed this way
  while the stolen key is still in active use.
references:
  - https://github.com/daveherrald/echolake-datasets/tree/main/datasets/cloud-data-exfiltration
author: Dave Herrald
date: 2026-10-27
logsource:
  product: github
  service: audit
detection:
  selection:
    action: 'secret_scanning_alert.resolved'
    resolution: 'wont_fix'
  condition: selection
falsepositives:
  - An analyst dismissing a known test credential or one already rotated.
level: medium
tags:
  - attack.persistence
  - attack.t1078
