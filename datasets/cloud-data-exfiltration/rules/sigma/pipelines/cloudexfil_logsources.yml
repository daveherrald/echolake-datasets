name: cloud-data-exfiltration logsources (source mapping)
priority: 20
# Maps the GitHub audit logsource used by the entry-point rule to Splunk/Lucene
# source filters. Replace the sources with your own index or sourcetype.
# Loki needs no pipeline (it matches on the stream directly).
transformations:
  - id: github_audit_source
    type: add_condition
    conditions:
      source: 'github:audit'
    rule_conditions:
      - type: logsource
        product: github
        service: audit
