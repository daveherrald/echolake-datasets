title: EC2 Instance Metadata (IMDS) Access From a Shell Command
id: 5c62778b-78f5-59c4-9488-6d2b2ccd4140
status: experimental
description: |
  Detects a process whose command line reaches the link-local instance-metadata
  address 169.254.169.254, including the IMDSv2 token PUT, the step that steals
  the EC2 instance-role credentials. Expected from SDKs, not from ad hoc curl in
  an interactive shell.
references:
  - https://github.com/daveherrald/echolake-datasets/tree/main/datasets/cloud-data-exfiltration
author: Dave Herrald
date: 2026-10-27
logsource:
  product: crowdstrike
  service: fdr
detection:
  selection:
    CommandLine|contains: '169.254.169.254'
  condition: selection
falsepositives:
  - Instance bootstrap scripts or SDK tooling that queries metadata; scope to
    interactive sessions.
level: high
tags:
  - attack.credential-access
  - attack.t1552.005
