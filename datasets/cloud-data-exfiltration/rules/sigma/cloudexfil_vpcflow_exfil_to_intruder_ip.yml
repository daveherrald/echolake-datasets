title: VPC Flow Egress to the Intruder Address
id: e66ba84a-8037-5203-b854-2505001d56e4
status: experimental
description: |
  Matches VPC flow records whose destination is the documented intruder address
  54.193.215.120, the egress side of the SFTP data transfer off the development
  host. Threat-intel seed; replace the address with your own indicator.
references:
  - https://github.com/daveherrald/echolake-datasets/tree/main/datasets/cloud-data-exfiltration
author: Dave Herrald
date: 2026-10-27
logsource:
  product: aws
  service: vpcflow
detection:
  selection:
    dstaddr: '54.193.215.120'
  condition: selection
falsepositives:
  - Later benign reuse of the address; it is a point-in-time indicator.
level: medium
tags:
  - attack.exfiltration
  - attack.t1048
