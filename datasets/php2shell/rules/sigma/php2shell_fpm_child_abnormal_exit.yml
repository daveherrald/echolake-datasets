title: PHP-FPM Child Abnormal Exit Code 70
id: 90b83292-5006-5d4a-a710-d40f3cf3c070
status: experimental
description: |
  Detects PHP-FPM workers exiting with code 70 and respawning, which corroborates the
  repeated pre-RINIT fatals driven by the PHP2SHELL memory-exhaustion probes. A burst
  of code-70 exits against one pool is the FPM-side view of the attack; FPM recovers on
  its own, which is why the denial of service only persists on Apache mod_php.
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2026-109618
  - https://nvd.nist.gov/vuln/detail/CVE-2026-109619
  - https://github.com/daveherrald/echolake-datasets/tree/main/datasets/php2shell
author: Dave Herrald
date: 2026-10-22
logsource:
  product: php
  service: php-fpm
detection:
  selection:
    message|contains|all:
      - '[pool www] child'
      - 'exited with code 70'
  condition: selection
falsepositives:
  - Any PHP fatal that terminates the worker, so correlate a burst rather than a single exit
level: low
tags:
  - attack.impact
  - attack.t1499.004
