metadata:
  name: linux-possible-append-command-to-at-allow-config-file
  version: 8.0.0
  description: The following analytic detects suspicious command lines that append user entries to /etc/at.allow or /etc/at.deny files. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions involving these files. This activity is significant because altering these configuration files can allow attackers to schedule tasks with elevated permissions, facilitating persistence on a compromised Linux host. If confirmed malicious, this could enable attackers to execute arbitrary code at scheduled intervals, potentially leading to further system compromise and unauthorized access to sensitive information.
  author: Teoderick Contreras, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - linux-privilege-escalation
  - linux-persistence-techniques
  - scheduled-tasks
  mitre_attack:
    techniques:
    - id: T1053.002
      name: At
      tactics:
      - execution
      - persistence
      - privilege-escalation
    tactics:
    - execution
