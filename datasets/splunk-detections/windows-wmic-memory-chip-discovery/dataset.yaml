metadata:
  name: windows-wmic-memory-chip-discovery
  version: 1.0.0
  description: "The following analytic detects the execution of Windows Management Instrumentation Command-line (WMIC) commands related to memory chip discovery on a Windows system. Specifically, it monitors instances where commands such as \u201Cwmic memorychip\u201D are used to retrieve detailed information about installed RAM modules. While these commands can serve legitimate administrative and troubleshooting purposes, they may also be employed by adversaries to gather system hardware specifications as part of their reconnaissance activities. By identifying and alerting on WMIC memory chip queries, security teams can enhance their ability to spot unauthorized information gathering and take proactive measures to mitigate potential threats."
  author: Teoderick Contreras, Splunk
  updated: '2025-08-25'
  license: Apache-2.0
