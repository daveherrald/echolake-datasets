metadata:
  name: windows-disable-internet-explorer-addons
  version: 1.0.0
  description: "The following analytic detects the execution of iexplore.exe (Internet Explorer) with the -extoff command-line flag, which disables all browser extensions. This flag is commonly abused by adversaries to launch a clean browser session that bypasses security controls such as antivirus browser extensions, toolbars, or group policy-enforced add-ons.\nMalicious documents or scripts may leverage iexplore.exe -extoff to open phishing pages, command-and-control interfaces, or download additional payloads in an environment free from security monitoring plugins. While this flag may be used legitimately by IT administrators for troubleshooting purposes, its use in modern enterprise environments is rare and should be considered suspicious\u2014particularly when launched by Office applications, scripting engines (e.g., PowerShell, WScript), or scheduled tasks."
  author: Teoderick Contreras, Splunk
  updated: '2025-05-26'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - malicious-inno-setup-loader
  mitre_attack:
