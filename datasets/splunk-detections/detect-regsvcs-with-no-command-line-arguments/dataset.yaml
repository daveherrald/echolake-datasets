metadata:
  name: detect-regsvcs-with-no-command-line-arguments
  version: 12.0.0
  description: The following analytic detects instances of regsvcs.exe running without command line arguments. This behavior typically indicates process injection, where another process manipulates regsvcs.exe. The detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names, IDs, and command-line executions. This activity is significant as it may signal an attempt to evade detection and execute malicious code. If confirmed malicious, the attacker could achieve code execution, potentially leading to privilege escalation, persistence, or access to sensitive information.
  author: Michael Haag, Splunk
  updated: '2025-12-15'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - suspicious-regsvcs-regasm-activity
  - living-off-the-land
