metadata:
  name: domain-account-discovery-with-dsquery
  version: 9.0.0
  description: The following analytic identifies the execution of `dsquery.exe` with command-line arguments used to discover domain users. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line executions. This activity is significant as it indicates potential reconnaissance efforts by adversaries to map out domain users, which is a common precursor to further attacks. If confirmed malicious, this behavior could allow attackers to gain insights into user accounts, facilitating subsequent actions like privilege escalation or lateral movement within the network.
  author: Teoderick Contreras, Mauricio Velazco, Splunk
  updated: '2025-08-27'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
