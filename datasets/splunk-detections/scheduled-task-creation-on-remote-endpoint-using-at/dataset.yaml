metadata:
  name: scheduled-task-creation-on-remote-endpoint-using-at
  version: 9.0.0
  description: The following analytic detects the creation of scheduled tasks on remote Windows endpoints using the at.exe command. This detection leverages Endpoint Detection and Response (EDR) telemetry, focusing on process creation events involving at.exe with remote command-line arguments. Identifying this activity is significant for a SOC as it may indicate lateral movement or remote code execution attempts by an attacker. If confirmed malicious, this activity could lead to unauthorized access, persistence, or execution of malicious code, potentially resulting in data theft or further compromise of the network.
  author: Mauricio Velazco, Splunk
  updated: '2025-08-22'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - active-directory-lateral-movement
  - living-off-the-land
  - scheduled-tasks
  mitre_attack:
    techniques:
    - id: T1053.002
      name: At
      tactics:
      - execution
      - persistence
      - privilege-escalation
    tactics:
    - execution
    - persistence
    - privilege-escalation
