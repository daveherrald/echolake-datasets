metadata:
  name: disable-show-hidden-files
  version: 13.0.0
  description: The following analytic detects modifications to the Windows registry that disable the display of hidden files. It leverages data from the Endpoint.Registry data model, specifically monitoring changes to registry paths associated with hidden file settings. This activity is significant because malware, such as worms and trojan spyware, often use hidden files to evade detection. If confirmed malicious, this behavior could allow an attacker to conceal malicious files on the system, making it harder for security tools and analysts to identify and remove the threat.
  author: Teoderick Contreras, Splunk, Steven Dick
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - windows-defense-evasion-tactics
  - windows-registry-abuse
  - azorult
  mitre_attack:
    techniques:
    - id: T1112
      name: Modify Registry
      tactics:
      - persistence
      - defense-evasion
    - id: T1562.001
      name: Disable or Modify Tools
      tactics:
      - defense-evasion
    - id: T1564.001
      name: Hidden Files and Directories
      tactics:
      - defense-evasion
    tactics:
    - persistence
    - defense-evasion
