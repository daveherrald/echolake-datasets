metadata:
  name: windows-rdp-client-launched-with-admin-session
  version: 2.0.0
  description: "This detection identifies the execution of the Windows Remote Desktop Client (mstsc.exe) with the \"/v\" and /admin command-line arguments. The \"/v\" flag specifies the remote host to connect to, while the /admin flag initiates a connection to the target system\u2019s console session, often used for administrative purposes. This combination may indicate that a user or attacker is performing privileged remote access, potentially to manage a system without disrupting existing user sessions. While such usage may be legitimate for IT administrators, it is less common in typical user behavior. Threat actors may abuse this capability during lateral movement to maintain stealthy access to high-value systems. Monitoring for this pattern can help detect interactive hands-on-keyboard activity, privilege abuse, or attempts to access critical infrastructure without leaving typical login traces associated with non-admin RDP sessions."
  author: Teoderick Contreras, Splunk
  updated: '2025-08-01'
  license: Apache-2.0
