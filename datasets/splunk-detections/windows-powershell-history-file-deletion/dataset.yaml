metadata:
  name: windows-powershell-history-file-deletion
  version: 3.0.0
  description: "The following analytic detects the usage of PowerShell to delete its command history file, which may indicate an attempt to evade detection by removing evidence of executed commands. PowerShell stores command history in ConsoleHost_history.txt under the user\u2019s profile directory. Adversaries or malicious scripts may delete this file using Remove-Item, del, or similar commands. This detection focuses on file deletion events targeting the history file, correlating them with recent PowerShell activity. While legitimate users may occasionally clear history, frequent or automated deletions should be investigated for potential defense evasion or post-exploitation cleanup activities."
  author: Teoderick Contreras, Splunk
  updated: '2025-06-24'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - medusa-ransomware
  mitre_attack:
