metadata:
  name: windows-outlook-loadmacroprovideronboot-persistence
  version: 1.0.0
  description: The following analytic detects the modification of the Windows Registry key "LoadMacroProviderOnBoot" under Outlook. This enables automatic loading of macros, which could allow malicious scripts to run without notice. This detection leverages data from the Endpoint.Registry datamodel to search for this key being enabled. This activity is significant as it is commonly associated with some malware infections, indicating potential malicious intent to harvest email information.
  author: Raven Tait, Splunk
  updated: '2025-09-09'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - notdoor-malware
  - windows-registry-abuse
