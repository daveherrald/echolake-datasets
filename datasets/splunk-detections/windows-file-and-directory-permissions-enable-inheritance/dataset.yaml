metadata:
  name: windows-file-and-directory-permissions-enable-inheritance
  version: 4.0.0
  description: The following analytic detects the enabling of permission inheritance using ICACLS. This analytic identifies instances where ICACLS commands are used to enable permission inheritance on files or directories. The /inheritance:e flag, which restores inherited permissions from a parent directory, is monitored to detect changes that might reapply broader access control settings. Enabling inheritance can indicate legitimate administrative actions but may also signal attempts to override restrictive custom permissions, potentially exposing sensitive files to unauthorized access.
  author: Teoderick Contreras, Splunk
  updated: '2025-11-20'
