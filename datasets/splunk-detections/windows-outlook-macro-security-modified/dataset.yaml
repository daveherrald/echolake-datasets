metadata:
  name: windows-outlook-macro-security-modified
  version: 1.0.0
  description: The following analytic detects the modification of the Windows Registry key "Level" under Outlook Security. This allows macros to execute without warning, which could allow malicious scripts to run without notice. This detection leverages data from the Endpoint.Registry datamodel, specifically looking for the registry value name "Level" with a value of "0x00000001". This activity is significant as it is commonly associated with some malware infections, indicating potential malicious intent to harvest email information.
  author: Raven Tait, Splunk
  updated: '2025-09-08'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - notdoor-malware
  - windows-registry-abuse
  mitre_attack:
    techniques:
