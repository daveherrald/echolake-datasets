metadata:
  name: windows-set-network-profile-category-to-private-via-registry
  version: 1.0.0
  description: "The following analytic detects attempts to modify the Windows Registry to change a network profile's category to \"Private\", which may indicate an adversary is preparing the environment for lateral movement or reducing firewall restrictions. Specifically, this activity involves changes to the Category value within the HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\NetworkList\\Profiles\\{GUID} registry path. A value of 1 corresponds to a private network profile, which typically enables less restrictive firewall policies. While this action can occur during legitimate network configuration, it may also be a sign of malicious behavior when combined with other indicators such as suspicious account activity, unexpected administrative privilege usage, or execution of unsigned binaries. Monitoring for this registry modification\u2014especially outside standard IT processes or correlated with persistence mechanisms\u2014can help identify stealthy post-exploitation activity."
  author: Teoderick Contreras, Splunk
  updated: '2025-10-07'
