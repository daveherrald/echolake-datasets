metadata:
  name: windows-executable-masquerading-as-benign-file-types
  version: 1.0.0
  description: The following analytic detects the presence of executable files masquerading as benign file types on Windows systems. Adversaries employ this technique to evade defenses and trick users into executing malicious code by renaming executables with extensions commonly associated with documents, images, or other non-executable formats (e.g., .pdf, .jpg, .doc, .png).
  author: Teoderick Contreras, Splunk
