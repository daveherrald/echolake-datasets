metadata:
  name: detect-path-interception-by-creation-of-program-exe
  version: 14.0.0
  description: The following analytic identifies the creation of a program executable in an unquoted service path, a common technique for privilege escalation. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process creation events where the parent process is 'services.exe'. This activity is significant because unquoted service paths can be exploited by attackers to execute arbitrary code with elevated privileges. If confirmed malicious, this could allow an attacker to gain higher-level access, potentially leading to full system compromise and persistent control over the affected endpoint.
  author: Patrick Bareiss, Splunk
  updated: '2025-10-14'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - windows-persistence-techniques
  - scattered-lapsus$-hunters
  mitre_attack:
    techniques:
    - id: T1574.009
      name: Path Interception by Unquoted Path
      tactics:
      - persistence
      - privilege-escalation
      - defense-evasion
    tactics:
