metadata:
  name: system-user-discovery-with-query
  version: 7.0.0
  description: The following analytic detects the execution of `query.exe` with command-line arguments aimed at discovering logged-in users. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line executions. This activity is significant as adversaries may use `query.exe` to gain situational awareness and perform Active Directory discovery on compromised endpoints. If confirmed malicious, this behavior could allow attackers to identify active users, aiding in further lateral movement and privilege escalation within the network.
  author: Mauricio Velazco, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - hunting
  - splunk-security-content
  - active-directory-discovery
  - medusa-ransomware
  mitre_attack:
    techniques:
    - id: T1033
      name: System Owner/User Discovery
      tactics:
      - discovery
    tactics:
    - discovery
