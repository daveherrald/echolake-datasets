metadata:
  name: bitsadmin-download-file
  version: 14.0.0
  description: The following analytic detects the use of `bitsadmin.exe` with the `transfer` parameter to download a remote object. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process and command-line telemetry. This activity is significant because `bitsadmin.exe` can be exploited to download and execute malicious files without immediate detection. If confirmed malicious, an attacker could use this technique to download and execute payloads, potentially leading to code execution, privilege escalation, or persistent access within the environment. Review parallel and child processes, especially `svchost.exe`, for associated artifacts.
  author: Michael Haag, Sittikorn S
  updated: '2025-10-14'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - ingress-tool-transfer
  - bits-jobs
  - darkside-ransomware
  mitre_attack:
