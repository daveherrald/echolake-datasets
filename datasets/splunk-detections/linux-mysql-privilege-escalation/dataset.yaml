metadata:
  name: linux-mysql-privilege-escalation
  version: 9.0.0
  description: The following analytic detects the execution of MySQL commands with elevated privileges using sudo, which can lead to privilege escalation. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process execution logs that include command-line details. This activity is significant because it indicates a potential misuse of MySQL to execute system commands as root, which could allow an attacker to gain root shell access. If confirmed malicious, this could result in full control over the affected system, leading to severe security breaches and unauthorized access to sensitive data.
  author: Gowthamaraj Rajendran, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
