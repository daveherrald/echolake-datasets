metadata:
  name: windows-raccine-scheduled-task-deletion
  version: 9.0.0
  description: The following analytic identifies the deletion of the Raccine Rules Updater scheduled task using the `schtasks.exe` command. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line executions. This activity is significant because adversaries may delete this task to disable Raccine, a tool designed to prevent ransomware attacks. If confirmed malicious, this action could allow ransomware to execute without interference, leading to potential data encryption and loss.
  author: Michael Haag, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
