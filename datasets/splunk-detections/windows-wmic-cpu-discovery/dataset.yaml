metadata:
  name: windows-wmic-cpu-discovery
  version: 1.0.0
  description: "The following analytic detects the use of WMIC (Windows Management Instrumentation Command-line) for CPU discovery, often executed with commands such as \u201Cwmic cpu get name\u201D This behavior is commonly associated with reconnaissance, where adversaries seek to gather details about system hardware, assess processing power, or determine if the environment is virtualized. While WMIC is a legitimate administrative tool, its use for CPU queries outside of normal inventory or management scripts can indicate malicious intent. Monitoring command-line executions of WMIC with CPU-related arguments and correlating with other discovery activity can help identify attacker reconnaissance."
  author: Teoderick Contreras, Splunk
  updated: '2025-08-25'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - lamehug
  mitre_attack:
    techniques:
    - id: T1082
      name: System Information Discovery
      tactics:
      - discovery
    tactics:
    - discovery
