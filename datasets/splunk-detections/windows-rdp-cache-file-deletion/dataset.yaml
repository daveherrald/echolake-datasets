metadata:
  name: windows-rdp-cache-file-deletion
  version: 1.0.0
  description: "This detection identifies the deletion of RDP bitmap cache files\u2014specifically .bmc and .bin files\u2014typically stored in the user profile under the Terminal Server Client\\Cache directory. These files are created by the native Windows Remote Desktop Client (mstsc.exe) and store graphical elements from remote sessions to improve performance. Deleting these files may indicate an attempt to remove forensic evidence of RDP usage. While rare in legitimate user behavior, this action is commonly associated with defense evasion techniques used by attackers or red teamers who wish to hide traces of interactive remote access. When observed in conjunction with recent logon activity, RDP session indicators, or script execution, this behavior should be treated as potentially malicious. Monitoring for deletion of these files provides valuable visibility into anti-forensic actions that often follow lateral movement or hands-on-keyboard activity."
  author: Teoderick Contreras, Splunk
  updated: '2025-07-30'
