metadata:
  name: windows-modify-registry-auto-update-notif
  version: 8.0.0
  description: The following analytic detects a suspicious modification to the Windows registry that changes the auto-update notification setting to "Notify before download." This detection leverages data from the Endpoint.Registry data model, focusing on specific registry paths and values. This activity is significant because it is a known technique used by adversaries, including malware like RedLine Stealer, to evade detection and potentially deploy additional payloads. If confirmed malicious, this modification could allow attackers to bypass security measures, maintain persistence, and exploit vulnerabilities on the target host.
  author: Teoderick Contreras, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - redline-stealer
  mitre_attack:
    techniques:
    - id: T1112
      name: Modify Registry
      tactics:
      - persistence
      - defense-evasion
    tactics:
    - persistence
    - defense-evasion
