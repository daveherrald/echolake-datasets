metadata:
  name: csc-net-on-the-fly-compilation
  version: 8.0.0
  description: The following analytic detects the use of the .NET compiler csc.exe for on-the-fly compilation of potentially malicious .NET code. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on specific command-line patterns associated with csc.exe. This activity is significant because adversaries and malware often use this technique to evade detection by compiling malicious code at runtime. If confirmed malicious, this could allow attackers to execute arbitrary code, potentially leading to system compromise, data exfiltration, or further lateral movement within the network.
  author: Teoderick Contreras, Splunk
  updated: '2025-12-15'
  license: Apache-2.0
  tags:
  - hunting
  - splunk-security-content
  - windows-defense-evasion-tactics
  mitre_attack:
