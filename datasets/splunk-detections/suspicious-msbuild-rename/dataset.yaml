metadata:
  name: suspicious-msbuild-rename
  version: 11.0.0
  description: The following analytic detects the execution of renamed instances of msbuild.exe. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and original file names within the Endpoint data model. This activity is significant because msbuild.exe is a legitimate tool often abused by attackers to execute malicious code while evading detection. If confirmed malicious, this behavior could allow an attacker to execute arbitrary code, potentially leading to system compromise, data exfiltration, or further lateral movement within the network.
  author: Michael Haag, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
