metadata:
  name: windows-autostart-execution-lsass-driver-registry-modification
  version: 7.0.0
  description: The following analytic detects modifications to undocumented registry keys that allow a DLL to load into lsass.exe, potentially capturing credentials. It leverages the Endpoint.Registry data model to identify changes to \CurrentControlSet\Services\NTDS\DirectoryServiceExtPt or \CurrentControlSet\Services\NTDS\LsaDbExtPt. This activity is significant as it indicates a possible attempt to inject malicious code into the Local Security Authority Subsystem Service (LSASS), which can lead to credential theft. If confirmed malicious, this could allow attackers to gain unauthorized access to sensitive information and escalate privileges within the environment.
  author: Michael Haag, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - windows-registry-abuse
  mitre_attack:
    techniques:
    - id: T1547.008
      name: LSASS Driver
      tactics:
      - persistence
      - privilege-escalation
    tactics:
    - persistence
    - privilege-escalation
