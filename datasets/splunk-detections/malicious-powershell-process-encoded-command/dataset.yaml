metadata:
  name: malicious-powershell-process-encoded-command
  version: 18.0.0
  description: The following analytic detects the use of the EncodedCommand parameter in PowerShell processes. It leverages Endpoint Detection and Response (EDR) data to identify variations of the EncodedCommand parameter, including shortened forms and different command switch types. This activity is significant because adversaries often use encoded commands to obfuscate malicious scripts, making detection harder. If confirmed malicious, this behavior could allow attackers to execute hidden code, potentially leading to unauthorized access, privilege escalation, or persistent threats within the environment. Review parallel events to determine legitimacy and tune based on known administrative scripts.
  author: David Dorsey, Michael Haag, Splunk, SirDuckly, GitHub Community
  updated: '2025-10-24'
  license: Apache-2.0
