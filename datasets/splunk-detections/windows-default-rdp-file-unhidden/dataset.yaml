metadata:
  name: windows-default-rdp-file-unhidden
  version: 1.0.0
  description: "This detection identifies the use of attrib.exe to remove hidden (-h) or system (-s) attributes from the Default.rdp file, which is automatically created in a user's Documents folder when a Remote Desktop Protocol (RDP) session is initiated using mstsc.exe. The Default.rdp file stores session configuration details such as the remote host address and screen settings. Unhiding this file is uncommon in normal user behavior and may indicate that an attacker or red team operator is attempting to access or manipulate RDP connection history that was previously hidden\u2014either by default or as part of an earlier anti-forensics effort. This activity may represent part of a broader pattern of reconnaissance or staging for credential reuse, lateral movement, or forensic analysis evasion. Monitoring for this behavior can help uncover suspicious manipulation of user artifacts and highlight interactive attacker activity on a compromised host."
  author: Teoderick Contreras, Splunk
  updated: '2025-07-30'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - windows-rdp-artifacts-and-defense-evasion
  mitre_attack:
    techniques:
