metadata:
  name: sdclt-uac-bypass
  version: 9.0.0
  description: The following analytic detects suspicious modifications to the sdclt.exe registry, a technique often used to bypass User Account Control (UAC). It leverages data from Endpoint Detection and Response (EDR) agents, focusing on specific registry paths and values associated with sdclt.exe. This activity is significant because UAC bypasses can allow attackers to execute payloads with elevated privileges without user consent. If confirmed malicious, this could lead to unauthorized code execution, privilege escalation, and potential persistence within the environment, posing a severe security risk.
  author: Steven Dick, Teoderick Contreras, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
