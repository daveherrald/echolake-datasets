metadata:
  name: windows-remote-services-rdp-enable
  version: 8.0.0
  description: The following analytic detects modifications in the Windows registry to enable Remote Desktop Protocol (RDP) on a targeted machine. It leverages data from the Endpoint.Registry datamodel, specifically monitoring changes to the "fDenyTSConnections" registry value. This activity is significant as enabling RDP via registry is uncommon and often associated with adversaries or malware attempting to gain remote access. If confirmed malicious, this could allow attackers to remotely control the compromised host, potentially leading to further exploitation and lateral movement within the network.
  author: Teoderick Contreras, Splunk
  updated: '2025-08-01'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - medusa-ransomware
  - blacksuit-ransomware
  - azorult
  mitre_attack:
