metadata:
  name: windows-credential-target-information-structure-in-commandline
  version: 1.0.0
  description: Detects DNS-based Kerberos coercion attacks where adversaries inject marshaled credential structures into DNS records to spoof SPNs and redirect authentication such as in CVE-2025-33073. This detection leverages process creation events looking for specific CREDENTIAL_TARGET_INFORMATION structures.
  author: Raven Tait, Splunk
  updated: '2025-11-13'
  license: Apache-2.0
