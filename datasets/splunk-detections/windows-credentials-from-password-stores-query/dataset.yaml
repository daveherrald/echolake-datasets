metadata:
  name: windows-credentials-from-password-stores-query
  version: 7.0.0
  description: The following analytic detects the execution of the Windows OS tool cmdkey.exe, which is often abused by post-exploitation tools like winpeas, commonly used in ransomware attacks to list stored usernames, passwords, or credentials. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process execution logs. This activity is significant as it indicates potential credential harvesting, which can lead to privilege escalation and persistence. If confirmed malicious, attackers could gain unauthorized access to sensitive information and maintain control over compromised systems for further exploitation.
  author: Teoderick Contreras, Splunk
  updated: '2025-11-20'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - windows-post-exploitation
  - prestige-ransomware
  - darkgate-malware
  mitre_attack:
    techniques:
    - id: T1555
      name: Credentials from Password Stores
      tactics:
      - credential-access
    tactics:
    - credential-access
  source_url: https://github.com/splunk/security_content/blob/29ece397e8ab7f95fd9055e586dd541859075a9f/detections/endpoint/windows_credentials_from_password_stores_query.yml
