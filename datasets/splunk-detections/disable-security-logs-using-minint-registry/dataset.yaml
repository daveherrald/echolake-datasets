metadata:
  name: disable-security-logs-using-minint-registry
  version: 12.0.0
  description: The following analytic detects a suspicious registry modification aimed at disabling security audit logs by adding a specific registry entry. It leverages data from the Endpoint.Registry data model, focusing on changes to the "Control\\MiniNt" registry path. This activity is significant because it can prevent Windows from logging any events to the Security Log, effectively blinding security monitoring efforts. If confirmed malicious, this technique could allow an attacker to operate undetected, making it difficult to trace their actions and compromising the integrity of security audits.
  author: Teoderick Contreras, Splunk, Steven Dick
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - windows-defense-evasion-tactics
  - cisa-aa23-347a
  - windows-registry-abuse
  mitre_attack:
    techniques:
    - id: T1112
      name: Modify Registry
      tactics:
      - persistence
      - defense-evasion
    tactics:
    - persistence
    - defense-evasion
