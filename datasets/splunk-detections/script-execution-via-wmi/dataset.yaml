metadata:
  name: script-execution-via-wmi
  version: 10.0.0
  description: The following analytic detects the execution of scripts via Windows Management Instrumentation (WMI) by monitoring the process 'scrcons.exe'. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process creation events. WMI-based script execution is significant because adversaries often use it to perform malicious activities stealthily, such as system compromise, data exfiltration, or establishing persistence. If confirmed malicious, this activity could allow attackers to execute arbitrary code, escalate privileges, or maintain long-term access to the environment. Analysts should differentiate between legitimate administrative use and potential threats.
  author: Rico Valdez, Michael Haag, Splunk
  updated: '2025-07-29'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - suspicious-wmi-use
  - scattered-spider
  mitre_attack:
