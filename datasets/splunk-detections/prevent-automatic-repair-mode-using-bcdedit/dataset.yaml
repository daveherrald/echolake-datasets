metadata:
  name: prevent-automatic-repair-mode-using-bcdedit
  version: 7.0.0
  description: The following analytic detects the execution of "bcdedit.exe" with parameters to set the boot status policy to ignore all failures. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line arguments. This activity is significant because it can indicate an attempt by ransomware to prevent a compromised machine from booting into automatic repair mode, thereby hindering recovery efforts. If confirmed malicious, this action could allow attackers to maintain control over the infected system, complicating remediation and potentially leading to further damage.
  author: Teoderick Contreras, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - ransomware
  - chaos-ransomware
  mitre_attack:
