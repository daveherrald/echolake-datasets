metadata:
  name: linux-possible-append-cronjob-entry-on-existing-cronjob-file
  version: 8.0.0
  description: The following analytic detects potential tampering with cronjob files on a Linux system by identifying 'echo' commands that append code to existing cronjob files. It leverages logs from Endpoint Detection and Response (EDR) agents, focusing on process names, parent processes, and command-line executions. This activity is significant because adversaries often use it for persistence or privilege escalation. If confirmed malicious, this could allow attackers to execute unauthorized code automatically, leading to system compromises and unauthorized data access, thereby impacting business operations and data integrity.
  author: Teoderick Contreras, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
