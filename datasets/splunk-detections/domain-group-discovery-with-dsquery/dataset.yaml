metadata:
  name: domain-group-discovery-with-dsquery
  version: 8.0.0
  description: The following analytic identifies the execution of `dsquery.exe` with command-line arguments used to query for domain groups. It leverages Endpoint Detection and Response (EDR) data, focusing on process names and command-line arguments. This activity is significant because both Red Teams and adversaries use `dsquery.exe` to enumerate domain groups, gaining situational awareness and facilitating further Active Directory discovery. If confirmed malicious, this behavior could allow attackers to map out the domain structure, identify high-value targets, and plan subsequent attacks, potentially leading to privilege escalation or data exfiltration.
  author: Mauricio Velazco, Splunk
  updated: '2025-08-27'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - active-directory-discovery
  - lamehug
  mitre_attack:
