metadata:
  name: rubeus-command-line-parameters
  version: 9.0.0
  description: The following analytic detects the use of Rubeus command line parameters, a toolset for Kerberos attacks within Active Directory environments. It leverages Endpoint Detection and Response (EDR) data to identify specific command-line arguments associated with actions like ticket manipulation, kerberoasting, and password spraying. This activity is significant as Rubeus is commonly used by adversaries to exploit Kerberos for privilege escalation and lateral movement. If confirmed malicious, this could lead to unauthorized access, persistence, and potential compromise of sensitive information within the network.
  author: Mauricio Velazco, Splunk
  updated: '2025-10-14'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - active-directory-privilege-escalation
  - cisa-aa23-347a
  - active-directory-kerberos-attacks
  mitre_attack:
    techniques:
    - id: T1550.003
      name: Pass the Ticket
      tactics:
      - defense-evasion
      - lateral-movement
    - id: T1558.003
      name: Kerberoasting
      tactics:
      - credential-access
    - id: T1558.004
      name: AS-REP Roasting
      tactics:
      - credential-access
    tactics:
    - defense-evasion
