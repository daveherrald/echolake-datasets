metadata:
  name: shai-hulud-2-exfiltration-artifact-files
  version: 1.0.0
  description: 'Detects creation of exfiltration artifact files associated with Shai-Hulud 2.0 npm supply

    chain malware. The malware creates cloud.json, contents.json, environment.json, truffleSecrets.json,

    and actionsSecrets.json files containing harvested credentials from AWS, Azure, GCP, GitHub secrets,

    and environment variables. These files are staged before being pushed to attacker-controlled repositories.'
  author: Michael Haag, Splunk
  updated: '2025-11-25'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - npm-supply-chain-compromise
  mitre_attack:
    techniques:
    - id: T1074.001
      name: Local Data Staging
      tactics:
      - collection
    - id: T1552.001
      name: Credentials In Files
      tactics:
      - credential-access
    - id: T1195.002
      name: Compromise Software Supply Chain
      tactics:
      - initial-access
    tactics:
    - initial-access
    - credential-access
    - collection
  source_url: https://github.com/splunk/security_content/blob/29ece397e8ab7f95fd9055e586dd541859075a9f/detections/endpoint/shai_hulud_2_exfiltration_artifact_files.yml
