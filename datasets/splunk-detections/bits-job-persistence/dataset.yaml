metadata:
  name: bits-job-persistence
  version: 9.0.0
  description: The following analytic detects the use of `bitsadmin.exe` to schedule a BITS job for persistence on an endpoint. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on specific command-line parameters such as `create`, `addfile`, and `resume`. This activity is significant because BITS jobs can be used by attackers to maintain persistence, download malicious payloads, or exfiltrate data. If confirmed malicious, this could allow an attacker to persist in the environment, execute arbitrary code, or transfer sensitive information, necessitating further investigation and potential remediation.
  author: Michael Haag, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - bits-jobs
  - living-off-the-land
  mitre_attack:
    techniques:
    - id: T1197
      name: BITS Jobs
      tactics:
      - persistence
      - defense-evasion
    tactics:
    - persistence
    - defense-evasion
