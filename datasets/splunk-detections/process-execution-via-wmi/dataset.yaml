metadata:
  name: process-execution-via-wmi
  version: 10.0.0
  description: The following analytic detects the execution of a process by `WmiPrvSE.exe`, indicating potential use of WMI (Windows Management Instrumentation) for process creation. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process and parent process relationships. This activity is significant as WMI can be used for lateral movement, remote code execution, or persistence by attackers. If confirmed malicious, this could allow an attacker to execute arbitrary commands or scripts, potentially leading to further compromise of the affected system or network.
  author: Rico Valdez, Michael Haag, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - suspicious-wmi-use
  mitre_attack:
    techniques:
    - id: T1047
      name: Windows Management Instrumentation
      tactics:
      - execution
    tactics:
