  - splunk-security-content
  - active-directory-lateral-movement
  - brute-ratel-c4
  - cisa-aa23-347a
  mitre_attack:
    techniques:
    - id: T1569.002
      name: Service Execution
      tactics:
      - execution
    tactics:
    - execution
