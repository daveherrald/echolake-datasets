metadata:
  name: linux-busybox-privilege-escalation
  version: 9.0.0
  description: The following analytic detects the execution of BusyBox with sudo privileges, which can lead to privilege escalation on Linux systems. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process creation events where BusyBox is executed with both 'sh' and 'sudo' commands. This activity is significant because it indicates a user may be attempting to gain root access, bypassing standard security controls. If confirmed malicious, this could allow an attacker to execute arbitrary commands as root, leading to full system compromise and potential persistence within the environment.
  author: Gowthamaraj Rajendran, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
