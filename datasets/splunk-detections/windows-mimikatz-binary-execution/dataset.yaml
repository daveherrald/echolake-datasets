metadata:
  name: windows-mimikatz-binary-execution
  version: 10.0.0
  description: The following analytic identifies the execution of the native mimikatz.exe binary on Windows systems, including instances where the binary is renamed. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and original file names. This activity is significant because Mimikatz is a widely used tool for extracting authentication credentials, posing a severe security risk. If confirmed malicious, this activity could allow attackers to obtain sensitive credentials, escalate privileges, and move laterally within the network, leading to potential data breaches and system compromise.
  author: Michael Haag, Splunk
  updated: '2025-07-29'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - sandworm-tools
  - volt-typhoon
  - flax-typhoon
  mitre_attack:
    techniques:
    - id: T1003
      name: OS Credential Dumping
      tactics:
      - credential-access
    tactics:
    - credential-access
