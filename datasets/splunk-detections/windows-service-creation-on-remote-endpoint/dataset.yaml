metadata:
  name: windows-service-creation-on-remote-endpoint
  version: 9.0.0
  description: The following analytic identifies the creation of a Windows Service on a remote endpoint using `sc.exe`. It detects this activity by analyzing process execution logs from Endpoint Detection and Response (EDR) agents, focusing on command-line arguments that include remote paths and service creation commands. This behavior is significant because adversaries often exploit the Service Control Manager for lateral movement and remote code execution. If confirmed malicious, this activity could allow attackers to execute arbitrary code on remote systems, potentially leading to further compromise and persistence within the network.
  author: Mauricio Velazco, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
