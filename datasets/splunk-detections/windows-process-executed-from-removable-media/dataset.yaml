      name: Hardware Additions
      tactics:
      - initial-access
    - id: T1025
      name: Data from Removable Media
      tactics:
      - collection
    - id: T1091
      name: Replication Through Removable Media
      tactics:
      - initial-access
      - lateral-movement
    tactics:
    - initial-access
    - lateral-movement
    - collection
