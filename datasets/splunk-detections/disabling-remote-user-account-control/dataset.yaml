metadata:
  name: disabling-remote-user-account-control
  version: 11.0.0
  description: The following analytic identifies modifications to the registry key that controls the enforcement of Windows User Account Control (UAC). It detects changes to the registry path `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA` where the value is set to `0x00000000`. This activity is significant because disabling UAC can allow unauthorized changes to the system without user consent, potentially leading to privilege escalation. If confirmed malicious, an attacker could gain elevated privileges, making it easier to execute further attacks or maintain persistence within the environment.
  author: David Dorsey, Patrick Bareiss, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - windows-defense-evasion-tactics
  - suspicious-windows-registry-activities
  - remcos
  mitre_attack:
    techniques:
    - id: T1548.002
      name: Bypass User Account Control
      tactics:
      - privilege-escalation
      - defense-evasion
    tactics:
