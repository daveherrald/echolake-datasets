metadata:
  name: windows-system-discovery-using-ldap-nslookup
  version: 6.0.0
  description: The following analytic detects the execution of nslookup.exe to query domain information using LDAP. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line arguments. This activity is significant as nslookup.exe can be abused by malware like Qakbot to gather critical domain details, such as SRV records and server names. If confirmed malicious, this behavior could allow attackers to map the network, identify key servers, and plan further attacks, potentially leading to data exfiltration or lateral movement within the network.
  author: Teoderick Contreras, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - qakbot
  mitre_attack:
    techniques:
    - id: T1033
      name: System Owner/User Discovery
      tactics:
      - discovery
    tactics:
    - discovery
