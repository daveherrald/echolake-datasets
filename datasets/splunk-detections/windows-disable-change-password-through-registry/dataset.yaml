metadata:
  name: windows-disable-change-password-through-registry
  version: 11.0.0
  description: The following analytic detects a suspicious registry modification that disables the Change Password feature on a Windows host. It identifies changes to the registry path "*\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\DisableChangePassword" with a value of "0x00000001". This activity is significant as it can prevent users from changing their passwords, a tactic often used by ransomware to maintain control over compromised systems. If confirmed malicious, this could hinder user response to an attack, allowing the attacker to persist and potentially escalate their access within the network.
  author: Teoderick Contreras, Splunk, Steven Dick
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - ransomware
  - windows-defense-evasion-tactics
