metadata:
  name: windows-scheduled-task-service-spawned-shell
  version: 7.0.0
  description: The following analytic detects when the Task Scheduler service ("svchost.exe -k netsvcs -p -s Schedule") spawns common command line, scripting, or shell execution binaries such as "powershell.exe" or "cmd.exe". This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process and parent process relationships. This activity is significant as attackers often abuse the Task Scheduler for execution and persistence, blending in with legitimate Windows operations. If confirmed malicious, this could allow attackers to execute arbitrary code, maintain persistence, or escalate privileges within the environment.
  author: Steven Dick
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - windows-persistence-techniques
  mitre_attack:
    techniques:
    - id: T1053.005
      name: Scheduled Task
      tactics:
      - execution
      - persistence
      - privilege-escalation
    - id: T1059
      name: Command and Scripting Interpreter
      tactics:
      - execution
    tactics:
    - execution
    - persistence
    - privilege-escalation
