metadata:
  name: windows-modify-registry-auto-minor-updates
  version: 8.0.0
  description: The following analytic identifies a suspicious modification to the Windows auto update configuration registry. It detects changes to the registry path "*\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU\\AutoInstallMinorUpdates" with a value of "0x00000000". This activity is significant as it is commonly used by adversaries, including malware like RedLine Stealer, to bypass detection and deploy additional payloads. If confirmed malicious, this modification could allow attackers to evade defenses, potentially leading to further system compromise and exploitation of zero-day vulnerabilities.
  author: Teoderick Contreras, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - hunting
  - splunk-security-content
  - redline-stealer
  mitre_attack:
    techniques:
    - id: T1112
      name: Modify Registry
      tactics:
      - persistence
      - defense-evasion
    tactics:
    - persistence
    - defense-evasion
