metadata:
  name: windows-schtasks-create-run-as-system
  version: 10.0.0
  description: The following analytic detects the creation of a new scheduled task using Schtasks.exe to run as the SYSTEM user. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions and process details. This activity is significant as it often indicates an attempt to gain elevated privileges or maintain persistence within the environment. If confirmed malicious, an attacker could execute code with SYSTEM-level privileges, potentially leading to data theft, ransomware deployment, or further system compromise. Immediate investigation and mitigation are crucial to prevent further damage.
  author: Michael Haag, Splunk
  updated: '2025-12-18'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - medusa-ransomware
  - windows-persistence-techniques
  - qakbot
  mitre_attack:
