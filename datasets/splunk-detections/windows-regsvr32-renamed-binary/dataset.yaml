metadata:
  name: windows-regsvr32-renamed-binary
  version: 8.0.0
  description: The following analytic identifies instances where the regsvr32.exe binary has been renamed and executed. This detection leverages Endpoint Detection and Response (EDR) data, specifically focusing on the original filename metadata. Renaming regsvr32.exe is significant as it can be an evasion technique used by attackers to bypass security controls. If confirmed malicious, this activity could allow an attacker to execute arbitrary DLLs, potentially leading to code execution, privilege escalation, or persistence within the environment.
  author: Teoderick Contreras, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
