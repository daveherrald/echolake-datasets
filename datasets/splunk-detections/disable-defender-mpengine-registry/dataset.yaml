metadata:
  name: disable-defender-mpengine-registry
  version: 12.0.0
  description: The following analytic detects the modification of the Windows Defender MpEngine registry value, specifically setting MpEnablePus to 0x00000000. This detection leverages endpoint registry logs, focusing on changes within the path "*\\Policies\\Microsoft\\Windows Defender\\MpEngine*". This activity is significant as it indicates an attempt to disable key Windows Defender features, potentially allowing malware to evade detection. If confirmed malicious, this could lead to undetected malware execution, persistence, and further system compromise. Immediate investigation and endpoint isolation are recommended.
  author: Teoderick Contreras, Splunk, Steven Dick
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - icedid
  - windows-registry-abuse
