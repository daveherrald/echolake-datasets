metadata:
  name: domain-account-discovery-with-wmic
  version: 9.0.0
  description: The following analytic detects the execution of `wmic.exe` with command-line arguments used to query for domain users. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on specific command-line patterns indicative of domain account discovery. This activity is significant as it often precedes lateral movement or privilege escalation attempts by adversaries. If confirmed malicious, this behavior could allow attackers to map out user accounts within the domain, facilitating further attacks and potentially compromising sensitive information.
  author: Teoderick Contreras, Mauricio Velazco, Splunk
  updated: '2025-07-28'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - active-directory-discovery
  - interlock-ransomware
  mitre_attack:
    techniques:
    - id: T1087.002
      name: Domain Account
      tactics:
      - discovery
    tactics:
    - discovery
