metadata:
  name: disable-defender-spynet-reporting
  version: 11.0.0
  description: The following analytic detects the modification of the registry to disable Windows Defender SpyNet reporting. It leverages data from the Endpoint.Registry data model, specifically monitoring changes to the registry path associated with Windows Defender SpyNet settings. This activity is significant because disabling SpyNet reporting can prevent Windows Defender from sending telemetry data, potentially allowing malicious activities to go undetected. If confirmed malicious, this action could enable an attacker to evade detection, maintain persistence, and carry out further attacks without being flagged by Windows Defender.
  author: Teoderick Contreras, Splunk, Steven Dick
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - azorult
  - windows-registry-abuse
  - qakbot
  mitre_attack:
    techniques:
    - id: T1562.001
      name: Disable or Modify Tools
      tactics:
      - defense-evasion
    tactics:
