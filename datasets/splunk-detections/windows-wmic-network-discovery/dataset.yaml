metadata:
  name: windows-wmic-network-discovery
  version: 1.0.0
  description: "The following analytic detects the execution of Windows Management Instrumentation Command-line (WMIC) commands used for network interface discovery on a Windows system. Specifically, it identifies commands such as \u201Cwmic nic\u201D that retrieve detailed information about the network adapters installed on the device. While these commands are commonly used by IT administrators for legitimate network inventory and diagnostics, they can also be leveraged by malicious actors for reconnaissance, enabling them to map network configurations and identify potential targets. Monitoring WMIC network interface queries allows security teams to detect suspicious or unauthorized enumeration activities, supporting early threat identification and response.\xDF"
  author: Teoderick Contreras, Splunk
  updated: '2025-08-25'
  license: Apache-2.0
  tags:
