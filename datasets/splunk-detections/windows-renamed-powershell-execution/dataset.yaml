metadata:
  name: windows-renamed-powershell-execution
  version: 3.0.0
  description: The following analytic identifies instances where the PowerShell executable has been renamed and executed under an alternate filename. This behavior is commonly associated with attempts to evade security controls or bypass logging mechanisms that monitor standard PowerShell usage. While rare in legitimate environments, renamed PowerShell binaries are frequently observed in malicious campaigns leveraging Living-off-the-Land Binaries (LOLBins) and fileless malware techniques. This detection flags executions of PowerShell where the process name does not match the default powershell.exe or pwsh.exe, especially when invoked from unusual paths or accompanied by suspicious command-line arguments.
  author: Teoderick Contreras, Nasreddine Bencherchali, Splunk
  updated: '2025-10-14'
  license: Apache-2.0
  tags:
