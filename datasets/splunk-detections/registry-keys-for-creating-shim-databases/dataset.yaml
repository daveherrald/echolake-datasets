metadata:
  name: registry-keys-for-creating-shim-databases
  version: 14.0.0
  description: The following analytic detects registry activity related to the creation of application compatibility shims. It leverages data from the Endpoint.Registry data model, specifically monitoring registry paths associated with AppCompatFlags. This activity is significant because attackers can use shims to bypass security controls, achieve persistence, or escalate privileges. If confirmed malicious, this could allow an attacker to maintain long-term access, execute arbitrary code, or manipulate application behavior, posing a severe risk to the integrity and security of the affected systems.
  author: Patrick Bareiss, Teoderick Contreras, Splunk, Steven Dick, Bhavin Patel
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - suspicious-windows-registry-activities
  - windows-persistence-techniques
  - windows-registry-abuse
  mitre_attack:
    techniques:
    - id: T1546.011
      name: Application Shimming
      tactics:
      - persistence
      - privilege-escalation
    tactics:
    - persistence
    - privilege-escalation
