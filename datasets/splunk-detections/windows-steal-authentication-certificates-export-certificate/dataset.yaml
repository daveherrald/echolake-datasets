metadata:
  name: windows-steal-authentication-certificates-export-certificate
  version: 8.0.0
  description: The following analytic detects the use of the PowerShell cmdlet 'export-certificate' executed via the command line, indicating an attempt to export a certificate from the local Windows Certificate Store. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process execution logs and command-line arguments. Exporting certificates is significant as it may indicate credential theft or preparation for man-in-the-middle attacks. If confirmed malicious, this activity could allow an attacker to impersonate users, decrypt sensitive communications, or gain unauthorized access to systems and data.
  author: Michael Haag, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - windows-certificate-services
  mitre_attack:
    techniques:
    - id: T1649
      name: Steal or Forge Authentication Certificates
      tactics:
      - credential-access
    tactics:
    - credential-access
