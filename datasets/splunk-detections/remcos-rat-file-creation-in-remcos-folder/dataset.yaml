metadata:
  name: remcos-rat-file-creation-in-remcos-folder
  version: 7.0.0
  description: The following analytic detects the creation of files in the Remcos folder within the AppData directory, specifically targeting keylog and clipboard log files. It leverages the Endpoint.Filesystem data model to identify .dat files created in paths containing "remcos." This activity is significant as it indicates the presence of the Remcos RAT, which performs keylogging, clipboard capturing, and audio recording. If confirmed malicious, this could lead to unauthorized data exfiltration and extensive surveillance capabilities for the attacker.
  author: Teoderick Contreras, Splunk, Sanjay Govind
  updated: '2025-05-02'
  license: Apache-2.0
