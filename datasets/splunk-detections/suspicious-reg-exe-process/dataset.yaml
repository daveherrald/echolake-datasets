metadata:
  name: suspicious-reg-exe-process
  version: 12.0.0
  description: The following analytic identifies instances of reg.exe being launched from a command prompt (cmd.exe) that was not initiated by the user, as indicated by a parent process other than explorer.exe. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process and parent process names. This activity is significant because reg.exe is often used in registry manipulation, which can be indicative of malicious behavior such as persistence mechanisms or system configuration changes. If confirmed malicious, this could allow an attacker to modify critical system settings, potentially leading to privilege escalation or persistent access.
  author: David Dorsey, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - windows-defense-evasion-tactics
  - disabling-security-tools
  - dhs-report-ta18-074a
  mitre_attack:
    techniques:
    - id: T1112
      name: Modify Registry
      tactics:
      - persistence
      - defense-evasion
    tactics:
    - persistence
    - defense-evasion
