metadata:
  name: remcos-client-registry-install-entry
  version: 10.0.0
  description: The following analytic detects the presence of a registry key associated with the Remcos RAT agent on a host. It leverages data from the Endpoint.Processes and Endpoint.Registry data models in Splunk, focusing on instances where the "license" key is found in the "Software\Remcos" path. This behavior is significant as it indicates potential compromise by the Remcos RAT, a remote access Trojan used for unauthorized access and data exfiltration. If confirmed malicious, the attacker could gain control over the system, steal sensitive information, or use the compromised host for further attacks. Immediate investigation and remediation are required.
  author: Steven Dick, Bhavin Patel, Rod Soto, Teoderick Contreras, Splunk
  updated: '2025-07-30'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - remcos
  - windows-registry-abuse
  mitre_attack:
    techniques:
    - id: T1112
      name: Modify Registry
      tactics:
      - persistence
      - defense-evasion
    tactics:
    - persistence
    - defense-evasion
