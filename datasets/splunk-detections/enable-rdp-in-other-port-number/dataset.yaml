metadata:
  name: enable-rdp-in-other-port-number
  version: 14.0.0
  description: The following analytic detects modifications to the registry that enable RDP on a machine using a non-default port number. It leverages data from the Endpoint.Registry data model, specifically monitoring changes to the registry path "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" and the "PortNumber" value. This activity is significant as attackers often modify RDP settings to facilitate lateral movement and maintain remote access to compromised systems. If confirmed malicious, this could allow attackers to bypass network defenses, gain persistent access, and potentially control the compromised machine.
  author: Teoderick Contreras, Splunk, Steven Dick
  updated: '2025-08-07'
  license: Apache-2.0
  tags:
  - ttp
  - splunk-security-content
  - prohibited-traffic-allowed-or-protocol-mismatch
  - windows-registry-abuse
  - windows-rdp-artifacts-and-defense-evasion
  mitre_attack:
    techniques:
    - id: T1021
      name: Remote Services
      tactics:
      - lateral-movement
    tactics:
    - lateral-movement
