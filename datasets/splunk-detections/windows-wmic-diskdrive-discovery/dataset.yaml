metadata:
  name: windows-wmic-diskdrive-discovery
  version: 1.0.0
  description: "The following analytic detects the use of Windows Management Instrumentation Command-line (WMIC) for disk drive discovery activities on a Windows system. This process involves monitoring commands such as \u201Cwmic diskdrive\u201D which are often used by administrators for inventory and diagnostics but can also be leveraged by attackers to enumerate hardware details for malicious purposes. Detecting these commands is essential for identifying potentially unauthorized asset reconnaissance or pre-attack mapping behaviors. By capturing and analyzing WMIC disk drive queries, security teams can gain visibility into suspicious activities, enabling them to respond promptly and strengthen the organization\u2019s security posture against insider threats or lateral movement attempts."
  author: Teoderick Contreras, Splunk
  updated: '2025-08-25'
  license: Apache-2.0
  tags:
