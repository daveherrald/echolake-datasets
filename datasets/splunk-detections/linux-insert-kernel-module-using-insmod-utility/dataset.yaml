metadata:
  name: linux-insert-kernel-module-using-insmod-utility
  version: 8.0.0
  description: The following analytic detects the insertion of a Linux kernel module using the insmod utility. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process execution logs that include process names and command-line details. This activity is significant as it may indicate the installation of a rootkit or malicious kernel module, potentially allowing an attacker to gain elevated privileges and bypass security detections. If confirmed malicious, this could lead to unauthorized code execution, persistent access, and severe compromise of the affected system.
  author: Teoderick Contreras, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
