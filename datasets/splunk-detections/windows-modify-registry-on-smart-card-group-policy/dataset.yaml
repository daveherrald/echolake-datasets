metadata:
  name: windows-modify-registry-on-smart-card-group-policy
  version: 6.0.0
  description: This analytic is developed to detect suspicious registry modifications targeting the "scforceoption" key. Altering this key enforces smart card login for all users, potentially disrupting normal access methods. Unauthorized changes to this setting could indicate an attempt to restrict access or force a specific authentication method, possibly signifying malicious intent to manipulate system security protocols.
  author: Teoderick Contreras, Splunk
