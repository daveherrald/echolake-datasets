metadata:
  name: windows-dns-query-request-to-tinyurl
  version: 1.0.0
  description: "The following analytic detects a process located in a potentially suspicious location making DNS queries to known URL shortening services, specifically tinyurl.\nURL shorteners are frequently used by threat actors to obfuscate malicious destinations, including phishing pages, malware distribution sites, or command-and-control (C2) endpoints.\nWhile tinyurl.com is a legitimate service, its use in enterprise environments\u2014particularly by non-browser processes or scripts\u2014should be considered suspicious, especially if correlated with subsequent outbound connections, file downloads, process file path or credential prompts. Analysts should investigate the source process, execution context, and destination domain to determine intent and risk."
  author: Teoderick Contreras, Splunk
  updated: '2025-06-02'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - malicious-inno-setup-loader
