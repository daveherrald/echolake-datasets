  - anomaly
  - splunk-security-content
  - proxyshell
  - blackbyte-ransomware
  - proxynotshell
  mitre_attack:
    techniques:
    - id: T1059.001
      name: PowerShell
      tactics:
      - execution
    tactics:
    - execution
