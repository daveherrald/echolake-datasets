metadata:
  name: windows-steal-authentication-certificates-export-pfxcertificate
  version: 8.0.0
  description: The following analytic detects the use of the PowerShell cmdlet `export-pfxcertificate` on the command line, indicating an attempt to export a certificate from the local Windows Certificate Store. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process execution logs and command-line arguments. This activity is significant as it may indicate an attempt to exfiltrate authentication certificates, which can be used to impersonate users or decrypt sensitive data. If confirmed malicious, this could lead to unauthorized access and potential data breaches.
  author: Michael Haag, Splunk
  updated: '2025-05-02'
  license: Apache-2.0
  tags:
  - anomaly
  - splunk-security-content
  - windows-certificate-services
  mitre_attack:
    techniques:
    - id: T1649
      name: Steal or Forge Authentication Certificates
      tactics:
      - credential-access
    tactics:
    - credential-access
