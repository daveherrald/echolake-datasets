    description: Reflective code loading micro-emulation
  name: ctid-reflective_loading
  version: 1.0.0
  description: 'CTID micro emulation plan ''Reflective Code Loading'' executed on a clean, instrumented
    Windows 11 workstation (EMU-WS01) and captured as replayable synthetic security telemetry. The CTID
    reflective_loading emulator reflectively executes shellcode in the current process. The shellcode
    launches PowerShell discovery commands including whoami, qwinsta, tasklist, Win32_product WMI inventory,
    and netstat. In the current Windows 11 lab build, the reliable captured signals are the reflective_loading
    process start, image load, and termination; the payload discovery commands did not produce a clean
    non-harness signal. Tool launched via a transient Task Scheduler action so process ancestry is svchost.exe
    (no orchestration scaffolding in the capture). Source: github.com/center-for-threat-informed-defense/adversary_emulation_library.'
  author: EchoLake Project
  created: '2026-06-29'
  license: CC0-1.0
  tags:
  - ctid
  - micro-emulation
  - reflective_loading
  - T1620
  - T1082
  - T1049
  - defense-evasion
  - discovery
  - windows
  - sysmon
  - echolake
