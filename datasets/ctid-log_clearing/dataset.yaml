    description: Windows event-log clearing micro-emulation
  name: ctid-log_clearing
  version: 1.0.0
  description: 'CTID micro emulation plan ''Clear Windows Event Logs'' executed on a clean, instrumented
    Windows 11 workstation (EMU-WS01) and captured as replayable synthetic security telemetry. The CTID
    log_clearing emulator clears Windows event logs with wevtutil. The lab run uses the Security-log-only
    path with --no-safe to avoid the upstream restore-instructions dialog blocking unattended execution;
    the VM snapshot rollback restores the lab state. Tool launched via a transient Task Scheduler action
    so process ancestry is svchost.exe (no orchestration scaffolding in the capture). Source: github.com/center-for-threat-informed-defense/adversary_emulation_library.'
  author: EchoLake Project
  created: '2026-06-29'
  license: CC0-1.0
  tags:
  - ctid
  - micro-emulation
  - log_clearing
  - T1070.001
  - defense-evasion
  - windows
  - sysmon
  - echolake
  mitre_attack:
    techniques:
    - id: T1070.001
      name: Clear Windows Event Logs
      tactics:
      - defense-evasion
    tactics:
    - defense-evasion
  timestamp_range:
    earliest: '2026-06-29T15:21:20Z'
    latest: '2026-06-29T15:22:17Z'
    field: _event_time
