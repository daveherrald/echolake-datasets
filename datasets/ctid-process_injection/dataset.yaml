  host:
    hostname: EMU-WS01
    os: Windows 11 Enterprise Eval
    workgroup: WORKGROUP
    platform: Proxmox/QEMU
    network: VLAN4 (zeek-monitored)
  execution:
    binary: process_injection.exe
    args:
    - -r
    - '20'
    - -l
    - C:\Windows\Temp\tools\pi_log.txt
    launch: transient scheduled task (SYSTEM, parent=svchost.exe)
  collection:
    sensor: Sysmon64
    shipper: Cribl Edge -> S3 zeeklogs-1337
    ingest: Lakewatch DLT -> lakewatch.bronze.microsoft_winevtlog
    defender: real-time on; tools path excluded (Tamper Protection enabled)
