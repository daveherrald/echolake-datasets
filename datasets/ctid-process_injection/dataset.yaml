metadata:
  name: ctid-process_injection
  version: 1.0.0
  description: 'CTID micro emulation plan ''Process Injection'' executed on a clean, instrumented Windows
    11 workstation (EMU-WS01) and captured as replayable synthetic security telemetry. The CTID process_injection
    emulator creates a suspended svchost.exe, allocates and writes shellcode into it, and runs it via
    CreateRemoteThread; the injected shellcode performs in-memory discovery (whoami, netstat, qwinsta,
    tasklist), then cleans up. Tool launched via a transient Task Scheduler action so process ancestry
    is svchost.exe (no orchestration scaffolding in the capture). Source: github.com/center-for-threat-informed-defense/adversary_emulation_library.'
  author: EchoLake Project
  created: '2026-06-28'
  license: CC0-1.0
  tags:
  - ctid
  - micro-emulation
  - process_injection
  - T1055
  - T1055.002
  - defense-evasion
  - privilege-escalation
  - windows
  - sysmon
  - echolake
  mitre_attack:
    techniques:
    - id: T1055
      name: Process Injection
      tactics:
      - defense-evasion
      - privilege-escalation
    - id: T1055.002
      name: Portable Executable Injection
      tactics:
      - defense-evasion
    tactics:
    - defense-evasion
    - privilege-escalation
  timestamp_range:
    earliest: '2026-06-28T14:39:22Z'
    latest: '2026-06-28T14:40:02Z'
    field: _event_time
