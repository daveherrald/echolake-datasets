metadata:
  name: paws-operation-yarn-ball
  version: 1.1.0
  description: >-
    PAWS (Pawsitive Vibes) Windows Active Directory capture with background lab
    activity across seven hosts and a short scripted intrusion prelude on
    PAWS-WS02. The evidenced sequence includes QEMU guest-agent PowerShell
    staging, Defender exclusion changes, OpenClaw-style host and domain
    discovery, attempted HTTP transfer commands, scheduled-task registration,
    staged-binary execution, and one outbound PowerShell connection to a lab
    host. The capture does not evidence the intended later stages of credential
    dumping, WinRM or PsExec lateral movement, bulk file encryption, or Windows
    event-log clearing. Contains 1,295,883 replayable events across Windows,
    Squid, and Zeek sources.
  author: EchoLake Project
  created: '2026-03-18'
  license: CC0-1.0
  tags:
  - paws
  - operation-yarn-ball
  - attack-simulation
  - attack-prelude
  - agentic-simulation
  - scripted-intrusion
  - windows
  - active-directory
  - sysmon
  - zeek
  - proxy
  - discovery
  - defense-evasion
  - scheduled-task
  - multi-host
  - echolake
  mitre_attack:
    techniques:
    - id: T1059.001
      name: 'Command and Scripting Interpreter: PowerShell'
      tactics:
      - execution
    - id: T1059.003
      name: 'Command and Scripting Interpreter: Windows Command Shell'
      tactics:
      - execution
    - id: T1059.007
      name: 'Command and Scripting Interpreter: JavaScript/JScript'
      tactics:
      - execution
    - id: T1082
      name: System Information Discovery
      tactics:
      - discovery
    - id: T1016
      name: System Network Configuration Discovery
      tactics:
      - discovery
    - id: T1033
      name: System Owner/User Discovery
      tactics:
      - discovery
    - id: T1087.001
      name: 'Account Discovery: Local Account'
      tactics:
      - discovery
    - id: T1069.002
      name: 'Permission Groups Discovery: Domain Groups'
      tactics:
      - discovery
    - id: T1018
