title: Outbound Connection to the Lab Retrieval Host on Port 9090
id: d5c2b18e-4a7f-43b0-9e63-7f8a51d2c306
status: experimental
description: |
  Detects the single outbound TCP connection in Operation Yarn Ball that the
  endpoint attributes to powershell.exe: PAWS-WS02 (192.168.4.24) to the lab host
  192.168.4.200 on port 9090. Roughly 327 KB flows back to the workstation on this
  connection, consistent with a retrieval channel. The recurring port 8080 traffic
  to the same lab segment is deliberately not flagged: the capture attributes it
  to a Python service on PAWS-DC01, not to this intrusion.
references:
  - https://github.com/daveherrald/echolake-datasets/tree/main/datasets/paws-operation-yarn-ball
author: Dave Herrald
date: 2026-11-03
logsource:
  product: zeek
  service: conn
detection:
  selection:
    id.resp_p: 9090
  condition: selection
falsepositives:
  - Any legitimate service on port 9090. Scope by the known lab or retrieval hosts
    before alerting in production.
level: medium
tags:
  - attack.command-and-control
  - attack.t1105
