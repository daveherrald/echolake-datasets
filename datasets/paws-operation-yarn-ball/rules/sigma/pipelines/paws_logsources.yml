name: paws-operation-yarn-ball logsources (source mapping)
priority: 20
# Maps the PowerShell script-block logsource used by the entry-point rule to
# Splunk/Lucene source filters. The dataset ships one XmlWinEventLog sourcetype
# across eight channel files; the filter selects the PowerShell channel. Replace
# the source with your own index or sourcetype. Loki needs no pipeline. The
# standard pysigma windows pipelines can be used instead of this one.
transformations:
  - id: win_powershell_source
    type: add_condition
    conditions:
      source: 'WinEventLog:Microsoft-Windows-PowerShell/Operational'
    rule_conditions:
      - type: logsource
        category: ps_scriptblock
        product: windows
