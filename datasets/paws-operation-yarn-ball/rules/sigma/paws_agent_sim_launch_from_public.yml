title: Agent Simulation Script Launched by node.exe from a Public Folder
id: 84d1c92e-a3b6-4d57-9a02-7c16e4b95f31
status: experimental
description: |
  Detects node.exe executing openclaw_sim.js out of C:\Users\Public, the scripted
  agentic foothold in Operation Yarn Ball. In this capture the simulation runs twice
  on PAWS-WS02, once with --recon-only, and every later discovery, transfer, and
  persistence command descends from these launches. Software should not execute
  from a world-writable directory.
references:
  - https://github.com/daveherrald/echolake-datasets/tree/main/datasets/paws-operation-yarn-ball
author: Dave Herrald
date: 2026-11-03
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\node.exe'
    CommandLine|contains: 'openclaw_sim.js'
  condition: selection
falsepositives:
  - Node tooling that legitimately stages scripts in C:\Users\Public. The
    combination of node.exe, a Public-folder script, and the recon commands that
    follow is the anomaly.
level: high
tags:
  - attack.execution
  - attack.t1059.007
