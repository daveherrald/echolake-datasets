title: Scripted Agent Contacts the yarn-ball.xyz Lab Domain
id: 3b7e5d16-9c48-4a20-8f5e-2d61b0c47a95
status: experimental
description: |
  Detects the curl commands the agent chain issues against yarn-ball.xyz: an HTTPS
  POST of %TEMP%\diag.txt to /api/v1/diagnostics (the diagnostic upload) and a GET
  of /api/v1/patch into %TEMP%\patch-kb5041234.exe (the staged binary retrieval).
  In this capture the contacts are attempts only; no DNS resolution or HTTP session
  for the domain appears in the network telemetry, so the command lines are the only
  place the signal exists.
references:
  - https://github.com/daveherrald/echolake-datasets/tree/main/datasets/paws-operation-yarn-ball
author: Dave Herrald
date: 2026-11-03
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: 'yarn-ball.xyz'
  condition: selection
falsepositives:
  - A legitimate service on the same domain. The upload-then-download sequence from
    a Public-folder agent chain is the anomaly.
level: high
tags:
  - attack.command-and-control
  - attack.t1071.001
  - attack.t1105
