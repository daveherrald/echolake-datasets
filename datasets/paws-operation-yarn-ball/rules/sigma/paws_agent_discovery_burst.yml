title: System and Domain Discovery from the Agent Chain
id: c2a9f04b-1e83-47d5-b2c8-6d17a3e59470
status: experimental
description: |
  Detects the discovery burst that follows the openclaw_sim.js launches in Operation
  Yarn Ball: whoami /all, hostname, ipconfig /all, systeminfo, net user, net group
  "Domain Admins" /domain, and net view, each run by cmd.exe children of node.exe
  on PAWS-WS02. The burst runs twice, once per simulation launch.
references:
  - https://github.com/daveherrald/echolake-datasets/tree/main/datasets/paws-operation-yarn-ball
author: Dave Herrald
date: 2026-11-03
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\node.exe'
  selection_commands:
    CommandLine|contains:
      - 'whoami'
      - 'hostname'
      - 'ipconfig'
      - 'systeminfo'
      - 'net user'
      - 'net group'
      - 'net view'
  condition: selection_parent and selection_commands
falsepositives:
  - Developer tooling that legitimately shells out from Node.js. The full seven-command
    recon set in a short window is the discriminator.
level: medium
tags:
  - attack.discovery
  - attack.t1082
  - attack.t1016
  - attack.t1033
  - attack.t1087.001
  - attack.t1069.002
  - attack.t1018
