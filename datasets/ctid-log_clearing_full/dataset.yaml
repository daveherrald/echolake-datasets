metadata:
  name: ctid-log_clearing_full
  version: 1.0.0
  description: 'CTID micro emulation plan ''Clear Windows Event Logs (Full Default)'' executed on a clean,
    instrumented Windows 11 workstation (EMU-WS01) and captured as replayable synthetic security telemetry.
    The CTID log_clearing emulator clears Security, System, and Application logs with its upstream no-argument
    path. The executable also displays restore instructions after clearing the logs; the harness terminates
    that prompt after the telemetry has been produced because the VM snapshot is the lab restore boundary.
    Tool launched via a transient Task Scheduler action so process ancestry is svchost.exe (no orchestration
    scaffolding in the capture). Source: github.com/center-for-threat-informed-defense/adversary_emulation_library.'
  author: EchoLake Project
  created: '2026-06-29'
  license: CC0-1.0
  tags:
  - ctid
  - micro-emulation
  - log_clearing_full
  - T1070.001
  - defense-evasion
  - windows
  - sysmon
  - echolake
  mitre_attack:
    techniques:
    - id: T1070.001
      name: Clear Windows Event Logs
      tactics:
      - defense-evasion
    tactics:
    - defense-evasion
  timestamp_range:
    earliest: '2026-06-29T16:43:32Z'
    latest: '2026-06-29T16:44:44Z'
    field: _event_time
