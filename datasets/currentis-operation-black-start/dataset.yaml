  pattern_type: sigma
  pattern: |
    logsource:
      category: process_access
      product: windows
    detection:
      selection:
        TargetImage|endswith: '\\lsass.exe'
        SourceImage|endswith: '\\kb5041234-v3.exe'
        GrantedAccess: '0x1FFFFF'
      condition: selection
  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - credential-access
  techniques:
  - T1003.001
  confidence: 85
  first_seen: '2026-06-09T02:01:39Z'
  last_seen: '2026-06-09T02:01:40Z'
