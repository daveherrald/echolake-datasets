  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - command-and-control
  - exfiltration
  techniques:
  - T1071.001
  - T1041
  confidence: 50
  first_seen: '2026-06-09T01:48:26Z'
  last_seen: '2026-06-09T02:45:15Z'
  description: Beacon destination from the workstation (tcp 8080) and exfiltration destination from the jump host
    (tcp 8080, 8443, 9009); the only non-RFC1918 address either attack host contacts, used as a literal IP with
    no DNS lookup. A publicly documented Cobalt Strike indicator (HTTP beacon, /push URI in the public profile,
    Aliyun ASN, first seen 2026-05-22), so a low-confidence threat-intel detection fires on replay.
