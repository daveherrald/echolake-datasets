  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - command-and-control
  techniques:
  - T1071.001
  confidence: 60
  first_seen: '2026-06-09T01:48:26Z'
  description: First beacon POST; later check-ins use randomized jquery-style paths under /scripts/, /script/, /bundles/,
    and /javascripts/ with a short numeric query key.
- id: c2-exfil-8080
  type: url
  value: http://121.43.243.13:8080/api/v1/upload
  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - exfiltration
  techniques:
  - T1041
  confidence: 80
  first_seen: '2026-06-09T02:31:28Z'
  description: Exfiltration POST from the jump host at 02:31:28.
- id: c2-exfil-8443
  type: url
  value: http://121.43.243.13:8443/upload
  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - exfiltration
  techniques:
  - T1041
  confidence: 80
  first_seen: '2026-06-09T02:43:58Z'
  description: Exfiltration POST from the jump host at 02:43:58; the 02:45:12 transfer on tcp 9009 is a raw socket
    write with no HTTP record.
- id: c2-beacon-ua
  type: indicator
  name: Beacon User-Agent
  pattern_type: sigma
  pattern: |
    logsource:
      product: zeek
      service: http
    detection:
      selection:
        user_agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/106.0.8287.614 Safari/537.36'
        id.resp_h: '121.43.243.13'
      condition: selection
  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - command-and-control
  techniques:
  - T1071.001
  confidence: 60
- id: phish-domain
  type: domain-name
  value: nerc-cip-portal.org
  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - initial-access
  techniques:
  - T1566
  confidence: 80
  description: Sender domain of the poisoned compliance document, which OpenClaw was configured to trust.
- id: phish-sender-addr
  type: email-addr
  value: compliance-noreply@nerc-cip-portal.org
  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - initial-access
  techniques:
  - T1566
  confidence: 80
- id: poison-msg
  type: email-message
  name: Poisoned NERC CIP-010 compliance message
  is_multipart: false
  subject: 'ACTION REQUIRED: CIP-010-4 Configuration Baseline Verification (Unit 3 SCADA)'
  message_id: <cip010-20260609-unit3-scada@nerc-cip-portal.org>
  date: '2026-06-09T01:38:27.529Z'
  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - initial-access
  techniques:
  - T1566
  confidence: 85
  first_seen: '2026-06-09T01:38:27Z'
  description: Received 01:38:27.529 and delivered 01:38:40.546 to rchen, mreyes, and dokonkwo (4383 bytes, network-message-id
    6cb73c8c-38ba-4601-d28a-08dec5c7cdcc). The embedded instruction tells the assistant to run an operator-identity
    verification command with its shell tool.
- id: poison-eml
  type: file
  name: poison_nerc_20260609.eml
  size: 4383
  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - initial-access
  techniques:
  - T1566
  confidence: 85
  first_seen: '2026-06-09T01:38:27Z'
  description: Source file of the poisoned message in the Exchange transport replay directory.
- id: openclaw-run-agent
  type: file
  name: run_agent.ps1
  description: C:\openclaw-agent\run_agent.ps1, the OpenClaw launcher; parent of the node.exe chain that ran the
    injected instruction.
- id: cip010-review
  type: file
  name: cip010_review.txt
  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - execution
  techniques:
  - T1059.001
  confidence: 70
  first_seen: '2026-06-09T01:40:00Z'
  description: Proof file written to C:\Users\Public by the injected instruction, later removed with Remove-Item.
- id: encoded-ps
  type: indicator
  name: Encoded PowerShell stager launched by the AI assistant
  pattern_type: sigma
  pattern: |
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: '\\node.exe'
        Image|endswith: '\\powershell.exe'
        CommandLine|contains: '-enc'
      condition: selection
  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - execution
  techniques:
  - T1059.001
  - T1027
  - T1204
  confidence: 85
- id: recon-cmds
  type: indicator
  name: Living-off-the-land domain recon burst
  pattern_type: sigma
  pattern: |
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
          - 'whoami /all'
          - 'net group /domain'
          - 'net user /domain'
          - 'nltest /dclist'
          - 'net user helixgrid-svc /domain'
      condition: selection
  indicator_types:
  - anomalous-activity
  kill_chain_phases:
  - discovery
  techniques:
  - T1087.002
  - T1482
  - T1069.002
  - T1018
  - T1033
  confidence: 60
  first_seen: '2026-06-09T01:40:41Z'
  last_seen: '2026-06-09T01:52:54Z'
  description: First from the agent chain as rchen (whoami, hostname), then the 01:52:53 burst spawned by the beacon
    as SYSTEM, ending with net user helixgrid-svc /domain. ipconfig, netstat, and Get-Process were not used by the
    attacker.
- id: implant-bin
  type: file
  name: kb5041234-v3.exe
  hashes:
    SHA-256: A81B6408AEEC93DF8013044BF4B4AD749BCDA02D8AC6555D241CB78AB991A747
    SHA-1: B7B53E5BDE804AEE646ED829E0F2EC0AD35B4523
    MD5: C466C0DD389790CFD3613754EC929DA8
  indicator_types:
  - malicious-activity
  kill_chain_phases:
  - command-and-control
  - defense-evasion
  techniques:
  - T1036.005
  - T1071.001
