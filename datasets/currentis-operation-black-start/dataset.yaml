    - {id: T1027, name: Obfuscated Files or Information, tactics: [defense-evasion]}
    - {id: T1140, name: Deobfuscate/Decode Files or Information, tactics: [defense-evasion]}
    - {id: T1087.002, name: 'Account Discovery: Domain Account', tactics: [discovery]}
    - {id: T1482, name: Domain Trust Discovery, tactics: [discovery]}
    - {id: T1069.002, name: 'Permission Groups Discovery: Domain Groups', tactics: [discovery]}
    - {id: T1018, name: Remote System Discovery, tactics: [discovery]}
    - {id: T1033, name: System Owner/User Discovery, tactics: [discovery]}
    - {id: T1036, name: Masquerading, tactics: [defense-evasion]}
    - {id: T1036.005, name: 'Masquerading: Match Legitimate Name or Location', tactics: [defense-evasion]}
    - {id: T1071.001, name: 'Application Layer Protocol: Web Protocols', tactics: [command-and-control]}
    - {id: T1003.001, name: 'OS Credential Dumping: LSASS Memory', tactics: [credential-access]}
    - {id: T1078, name: Valid Accounts, tactics: [defense-evasion, persistence, privilege-escalation, initial-access]}
    - {id: T1021.001, name: 'Remote Services: Remote Desktop Protocol', tactics: [lateral-movement]}
    - {id: T1133, name: External Remote Services, tactics: [initial-access, persistence]}
    - {id: T1083, name: File and Directory Discovery, tactics: [discovery]}
    - {id: T1005, name: Data from Local System, tactics: [collection]}
    - {id: T1041, name: Exfiltration Over C2 Channel, tactics: [exfiltration]}
    - {id: T1567, name: Exfiltration Over Web Service, tactics: [exfiltration]}
    - {id: T1053.005, name: 'Scheduled Task/Job: Scheduled Task', tactics: [execution, persistence]}
    - {id: T1547.001, name: 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder', tactics: [persistence, privilege-escalation]}
    - {id: T1070.001, name: 'Indicator Removal: Clear Windows Event Logs', tactics: [defense-evasion]}
    - {id: T1070.004, name: 'Indicator Removal: File Deletion', tactics: [defense-evasion]}
    - {id: T0859, name: 'ICS: Valid Accounts', tactics: [ics-lateral-movement]}
    - {id: T0822, name: 'ICS: External Remote Services', tactics: [ics-initial-access]}
    - {id: T0888, name: 'ICS: Remote System Information Discovery', tactics: [ics-discovery]}
    - {id: T0882, name: 'ICS: Theft of Operational Information', tactics: [ics-collection]}
    - {id: T0831, name: 'ICS: Manipulation of Control (staged, not fired)', tactics: [ics-impair-process-control]}
    tactics: [initial-access, execution, discovery, command-and-control, credential-access, lateral-movement, collection, exfiltration, defense-evasion, persistence, privilege-escalation]
  timestamp_range:
    earliest: '2026-06-09T01:20:00Z'
    latest: '2026-06-09T02:50:00Z'
    field: _event_time
  attack_flow:
    path: attack_flow.json
    format: stix-2.1
    schema_version: 2.0.0
    description: Eight-stage kill chain with entities and observables, built from this manifest by echolake build-attack-flow
files:
  bundled:
  - {path: data/microsoft_winevtlog.xml.gz, description: 'Windows Sysmon + Security + PowerShell across all Currentis hosts (attack + baseline)', format: xml, sourcetype: XmlWinEventLog, schema: windows_events_xml, event_count: 93104, log_source: {vendor: Microsoft, product: Windows, category: winevtlog}}
  - {path: data/zeek_dns.jsonl.gz, description: 'Zeek DNS logs (name-resolution baseline)', format: jsonl, sourcetype: "zeek:dns", schema: native, event_count: 45235, log_source: {vendor: Zeek, product: Zeek, category: dns}}
  - {path: data/zeek_conn.jsonl.gz, description: 'Zeek connection logs (incl. the C2 beacon and exfil to the documented indicator)', format: jsonl, sourcetype: "zeek:conn", schema: native, event_count: 30897, log_source: {vendor: Zeek, product: Zeek, category: conn}}
  - {path: data/squid_access.log.gz, description: 'Squid proxy access log (currentis-proxy web traffic)', format: text, sourcetype: "squid:access", schema: native, event_count: 979, log_source: {vendor: Squid, product: Squid, category: access}}
  - {path: data/linux_syslog.log.gz, description: 'Linux syslog (currentis-proxy sshd and systemd session events)', format: text, sourcetype: "linux:syslog", schema: native, event_count: 268, log_source: {vendor: Linux, product: syslog, category: syslog}}
  - {path: data/zeek_http.jsonl.gz, description: 'Zeek HTTP logs (incl. the HTTP C2 beacon requests)', format: jsonl, sourcetype: "zeek:http", schema: native, event_count: 768, log_source: {vendor: Zeek, product: Zeek, category: http}}
  - {path: data/slack_messages.jsonl.gz, description: 'Slack persona chatter (human baseline / needle-in-haystack)', format: jsonl, sourcetype: slack, schema: native, event_count: 404, log_source: {vendor: Slack, product: Slack, category: messages}}
  - {path: data/exchange_message_tracking.log.gz, description: 'Exchange message tracking (incl. the poisoned NERC CIP-010 document to rchen + 2 others)', format: text, sourcetype: "MSExchange:MessageTracking", schema: native, event_count: 14, log_source: {vendor: Microsoft, product: Exchange, category: message_tracking}}
environment:
  host:
    domain: currentis.local
    platform: Proxmox/QEMU
    network: VLAN4 192.168.4.0/24
  execution:
    actor: GLACIER DRIFT (fictional; modeled on Volt Typhoon / VOLTZITE + SYLVANITE + ELECTRUM, not attributed)
    patient_zero: Rachel Chen (rchen) on CURRENTIS-WS-RACHEL 192.168.4.233 (EDR-free ML workstation)
    pivot_account: helixgrid-svc (stolen turbine-vendor remote-access account)
    ot_target: CURRENTIS-SCADA-JH-02 192.168.4.244 (OT jump host, Helix Grid Systems OptiCore / Unit 3)
    c2: Sliver HTTP (C2 address rewritten to documented indicator 121.43.243.13 for this dataset)
  collection:
    collector: Cribl Edge
    sysmon: SwiftOnSecurity config
    audit_policy: 'Security 4624/4663/4768/4769/1102; SACL on C:\OT and C:\Program Files\Helix Grid Systems'
entities:
- id: ws-rachel
  type: infrastructure
  name: CURRENTIS-WS-RACHEL
  role: patient-zero
  description: Rachel Chen's machine-learning workstation, deliberately EDR-free (Falcon pulled because it quarantined
    the OpenClaw runtime), where the OpenClaw AI coding assistant ran and where the intrusion started.
  infrastructure_types:
  - workstation
  observables:
  - ws-rachel-ip
  - ws-rachel-fqdn
- id: dc01
  type: infrastructure
  name: CURRENTIS-DC01
  role: monitored-pivot-path
  description: Instrumented domain controller; the only monitored hop, it authenticates the lateral movement between
    the two blind spots (4768/4769 for helixgrid-svc).
  infrastructure_types:
  - domain-controller
  observables:
  - dc01-ip
  - dc01-fqdn
- id: scada-jh-02
  type: infrastructure
  name: CURRENTIS-SCADA-JH-02
  role: ot-target
  description: Unmonitored OT jump host carrying the Helix Grid Systems OptiCore engineering software and the Unit
    3 turbine configuration and alarm profile.
  infrastructure_types:
  - workstation
  - control-system
  observables:
  - scada-jh-02-ip
  - scada-jh-02-fqdn
- id: exch
  type: infrastructure
  name: CURRENTIS-EXCH
  role: mail-server
  description: Exchange server that received and delivered the poisoned compliance document to three recipients.
  infrastructure_types:
  - mail-server
  observables:
  - exch-ip
  - exch-fqdn
- id: proxy
  type: infrastructure
  name: currentis-proxy
  role: egress-proxy
  description: Squid proxy on tcp 3128, the hosts' web egress path and the source of the Linux syslog and Squid
    access log.
  infrastructure_types:
  - proxy
  observables:
  - proxy-ip
- id: rchen
  type: user-account
  name: Rachel Chen
  account_login: rchen
  user_id: S-1-5-21-2928221834-3438643503-1157344558-1162
  account_type: windows-domain
  is_privileged: true
  role: victim
  description: ML engineer granted local admin in Slack for her model runtime and the OpenClaw agent, which she
    wired to auto-act on email from the trusted compliance sender. The stage-0 agent chain and the cmdkey/mstsc
    pivot run as rchen; the implant and recon run as SYSTEM.
- id: helixgrid-svc
  type: user-account
  account_login: helixgrid-svc
  account_type: windows-domain
  is_service_account: true
  role: compromised-service
  description: Helix Grid Systems remote-support account (per MSA-2024-117). Its cached credential was harvested
    from LSASS on the workstation and used with cmdkey and mstsc for the IT-to-OT RDP pivot, then for the OT file
    reads. The account, not the host, is the anomaly.
- id: currentis-energy
  type: identity
  name: Currentis Energy
  identity_class: organization
  sectors:
  - energy
  - utilities
  role: victim-organization
  description: Fictional utility, Active Directory domain currentis.local on VLAN 192.168.4.0/24, with a wind-farm
    SCADA segment.
- id: glacier-drift
  type: threat-actor
  name: GLACIER DRIFT
  threat_actor_types:
  - nation-state
  role: attacker
  description: Fictional state-aligned actor, modeled on but not attributed to public reporting.
- id: sliver-c2
  type: infrastructure
  name: Sliver HTTP C2
  role: attacker
  description: HTTP command-and-control on tcp 8080 (beacon) and 8080, 8443, and 9009 (exfil); the lab address was
    rewritten to a publicly documented Cobalt Strike indicator so a threat-intel detection fires on replay.
  infrastructure_types:
  - command-and-control
  - exfiltration
  observables:
  - c2-ip
  - c2-beacon-uri
  - c2-exfil-8080
  - c2-exfil-8443
  - c2-beacon-ua
- id: phish-sender
  type: infrastructure
  name: nerc-cip-portal.org compliance sender
  role: attacker
  description: The trusted compliance sender whose identity carried the poisoned NERC CIP-010 document; the domain
    is never resolved in Zeek DNS, it exists only in the mail path and the injected prompt.
  infrastructure_types:
  - phishing
  observables:
  - phish-domain
  - phish-sender-addr
  - poison-msg
  - poison-eml
- id: openclaw
  type: tool
  name: OpenClaw AI coding assistant
  role: abused-tool
  description: Agentic coding assistant (node.exe, local qwen2.5:7b via ollama) wired to auto-run the Unit 3 review
    on any notice from the compliance sender with no human in the loop; the injected instruction executed through
    its shell tool.
  observables:
  - openclaw-run-agent
  - cip010-review
- id: sliver
  type: tool
  name: Sliver
  tool_types:
  - remote-access
  role: attacker
  description: Implant framework behind the masqueraded beacon binary.
  observables:
  - implant-bin
  - clientsync-ps1
