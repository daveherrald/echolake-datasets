name: currentis logsources (source mapping)
priority: 20
# Maps the Zeek conn logsource used by the entry-point rule to Splunk/Lucene
# source filters. Replace the sources with your own index or sourcetype. Loki
# needs no pipeline (it matches on the stream directly).
transformations:
  - id: zeek_conn_source
    type: add_condition
    conditions:
      source:
        - 'zeek_conn'
        - '/opt/zeek/logs/current/conn.log'
    rule_conditions:
      - type: logsource
        product: zeek
        service: conn
