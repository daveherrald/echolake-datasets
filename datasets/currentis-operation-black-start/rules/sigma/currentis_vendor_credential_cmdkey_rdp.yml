title: Stolen Vendor Credential Staged with cmdkey for RDP
id: 1d1a6df8-706c-4326-b973-38aac86546c7
status: experimental
description: |
  Detects cmdkey staging the stolen helixgrid-svc turbine-vendor credential for a
  Terminal Services (RDP) session in Operation Black Start, the setup for the
  IT-to-OT pivot. clientsync.ps1 runs cmdkey /generic:TERMSRV/... then mstsc opens
  the session to the SCADA jump host.
references:
  - https://github.com/daveherrald/echolake-datasets/tree/main/datasets/currentis-operation-black-start
author: Dave Herrald
date: 2026-10-22
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cmdkey.exe'
    CommandLine|contains|all:
      - '/generic:TERMSRV/'
      - 'helixgrid-svc'
  condition: selection
falsepositives:
  - Administrators pre-staging RDP credentials with cmdkey. The vendor service
    account name is the anomaly, not the tool.
level: high
tags:
  - attack.lateral-movement
  - attack.t1021.001
  - attack.t1078
